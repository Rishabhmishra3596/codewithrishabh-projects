<!DOCTYPE html>
<!-- Liquid Button — @CodeWithRishabh3596 -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Button</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;font-family:Poppins,sans-serif;
  background:radial-gradient(circle at 50% 40%,#ececea,#c9c9c5);transition:background .6s}
body.dark{background:radial-gradient(circle at 50% 40%,#232327,#050506)}
.tray{display:flex;flex-direction:column;gap:22px;padding:28px;border-radius:48px;
  transform:perspective(1400px) rotateX(45deg) rotateZ(-30deg);
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.1));
  border:2px solid rgba(255,255,255,.6);
  box-shadow:inset 0 3px 10px rgba(255,255,255,.8),0 12px 0 rgba(160,160,160,.35),0 40px 60px rgba(0,0,0,.2)}
.pill{--c:#3d7bff;all:unset;cursor:pointer;width:380px;height:90px;border-radius:999px;
  display:flex;align-items:center;gap:18px;padding:0 24px 0 16px;font-size:22px;color:#2a2a2e;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(14px) saturate(160%);
  border:2px solid rgba(255,255,255,.8);
  box-shadow:inset 0 4px 10px #fff,inset 0 -10px 18px rgba(0,0,0,.07),0 10px 0 rgba(150,150,155,.45),0 26px 34px rgba(0,0,0,.18);
  transition:.45s cubic-bezier(.2,.8,.2,1)}
.pill:active{transform:scale(.96)}
.pill .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55)}
.pill svg{width:28px;fill:currentColor}
.pill.on{color:#fff;animation:squish .7s cubic-bezier(.3,1.6,.5,1);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,#fff),var(--c));
  box-shadow:inset 0 4px 12px rgba(255,255,255,.9),0 10px 0 color-mix(in srgb,var(--c) 60%,#000),0 0 60px var(--c)}
.pill.on .ic{background:rgba(255,255,255,.3)}
.dark .pill:not(.on){color:#eee;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.35)}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(.94,.16)}55%{transform:scale(.94,.16)}100%{transform:scale(1)}}
.sleep{--c:#3d7bff}.dnd{--c:#ff2236}.me{--c:#ff9416}
</style></head><body>
<div class="tray">
  <button class="pill sleep"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7h2v6h7V8h6a3 3 0 0 1 3 3v6h-2v-2H5v2H3zM8.5 12a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg></span>Sleep</button>
  <button class="pill dnd" data-dark><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3z"/></svg></span>Do Not Disturb</button>
  <button class="pill me"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span>Personal</button>
</div>
<script>
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
  const on=!p.classList.contains('on');
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
  p.classList.toggle('on',on);
  document.body.classList.toggle('dark',on&&p.hasAttribute('data-dark'));
});
</script>
</body></html>
