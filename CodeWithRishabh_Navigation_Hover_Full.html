<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Navigation Hover Upgrade | Code With Rishabh</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f5f5f8; color: #17171b; font-family: Arial,sans-serif; }
main { width: min(680px,94vw); padding: 40px 12px; text-align: center; }
h1 { font-size: clamp(25px,5vw,38px); margin: 0 0 40px; }
h2 { font-size: 24px; margin: 32px 0 18px; }
.navbar { display: flex; gap: 8px; padding: 10px; background: #fff; border-radius: 16px; box-shadow: 0 12px 22px #00000012; }
.navbar a { position: relative; isolation: isolate; display: grid; place-items: center; flex: 1; min-width: 0; min-height: 55px; border-radius: 11px; color: #17171b; text-decoration: none; font-size: clamp(11px,2.3vw,15px); font-weight: 600; }
.navbar a:focus-visible { outline: 3px solid #3c2865; outline-offset: 3px; }
.basic a:hover, .basic a:focus-visible { background: #8848ef; color: #fff; }
.premium a { overflow: hidden; transition: color .25s; }
.premium a span { position: relative; z-index: 1; }
.premium a::before { content: ''; position: absolute; z-index: 0; width: 180%; aspect-ratio: 1; left: -40%; top: 115%; background: #8848ef; border-radius: 42% 48% 43% 46%; transition: top .55s cubic-bezier(.2,.8,.2,1); animation: gooey 6s linear infinite; }
.premium a:hover, .premium a:focus-visible { color: #fff; }
.premium a:hover::before, .premium a:focus-visible::before { top: -40%; }
@keyframes gooey { to { transform: rotate(360deg); } }
p { color: #757580; font-size: 14px; margin-top: 35px; }
.credit { color: #6435ae; text-underline-offset: 4px; }
@media (prefers-reduced-motion: reduce) { .premium a, .premium a::before { transition: none; animation: none; } }
</style>
</head>
<body>
<main>
<h1>Navigation Hover Upgrade</h1>
<h2>Basic Hover</h2>
<nav class="navbar basic" aria-label="Basic hover demonstration">
      <a href="#home"><span>Home</span></a>
      <a href="#about"><span>About</span></a>
      <a href="#services"><span>Services</span></a>
      <a href="#contact"><span>Contact</span></a>
</nav>
<h2>Premium Hover</h2>
<nav class="navbar premium" aria-label="Liquid hover demonstration">
      <a href="#home"><span>Home</span></a>
      <a href="#about"><span>About</span></a>
      <a href="#services"><span>Services</span></a>
      <a href="#contact"><span>Contact</span></a>
</nav>
<p>Hover over a link, or use Tab to focus it.</p>
<p>Demo links only; replace their href values with your own pages.</p>

</main>
</body>
</html>
