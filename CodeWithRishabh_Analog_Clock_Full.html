<title>Analog Clock Effect | Code With Rishabh</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #e6e9f0; font-family: Arial,sans-serif; }
main { text-align: center; padding: 36px 20px; }
.clock {
 position: relative; width: min(330px,80vw); aspect-ratio: 1;
 border-radius: 50%; background: #e7ebf1;
 border: 6px solid #edf1f6;
 box-shadow: 12px 12px 24px #bac1cd, -12px -12px 24px #fff,
 inset 4px 4px 9px #c8cfda, inset -4px -4px 9px #fff;
}
.number { position: absolute; inset: 10%; transform: rotate(calc(var(--i) * 30deg)); color: #a2aab7; font-size: clamp(14px,4vw,19px); }
.number b { display: inline-block; transform: rotate(calc(var(--i) * -30deg)); font-weight: 400; }
.tick { position: absolute; inset: 3%; transform: rotate(calc(var(--i) * 6deg)); }
.tick::before { content: ''; display: block; width: 2px; height: 4px; margin: auto; background: #c7cdd7; border-radius: 2px; }
.tick:nth-child(5n)::before { height: 7px; background: #b8c0cb; }
.hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 8px; box-shadow: 2px 2px 3px #0002; animation: turn var(--duration) linear infinite; }
.hour { width: 6px; height: 24%; margin-left: -3px; background: #48505c; --start: 105.5083deg; --duration: 43200s; }
.minute { width: 4px; height: 32%; margin-left: -2px; background: #646e7b; --start: 186.1deg; --duration: 3600s; }
.second { width: 2px; height: 38%; margin-left: -1px; background: #df626e; --start: 6deg; --duration: 60s; }
.pin { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; transform: translate(-50%,-50%); border: 3px solid #f5f7fb; border-radius: 50%; background: #929ba8; box-shadow: 1px 2px 3px #0002; }
@keyframes turn { from { transform: rotate(var(--start)); } to { transform: rotate(calc(var(--start) + 360deg)); } }
p { margin-top: 36px; font-size: 13px; color: #697481; }
a { color: #35556b; text-underline-offset: 4px; }
@media (prefers-reduced-motion: reduce) { .hand { animation: none; transform: rotate(var(--start)); } }
</style>
