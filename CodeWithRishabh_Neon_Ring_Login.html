<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Neon Ring Login | CodeWithRishabh</title>
  <style>
    /* Single-file frontend demo by @codewithrishabh3596.
       No framework, external font, backend, or data collection. */
    * { box-sizing: border-box; }
    :root {
      --navy: #00172f;
      --cyan: #37eeff;
      --pink: #f646df;
      --ink: #edfaff;
      --muted: #b0bdcf;
    }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 72px 20px 44px;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--navy);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 5px;
    }
    .branding {
      position: absolute;
      top: 24px;
      left: 24px;
      color: #fff;
      font-weight: 750;
      text-decoration: none;
      letter-spacing: -.02em;
    }
    .demo { width: min(100%, 470px); text-align: center; }
    .scene {
      width: min(100%, 440px);
      aspect-ratio: 1;
      position: relative;
      margin: 0 auto;
      perspective: 1100px;
      isolation: isolate;
    }
    .ring-window {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 15px #37eeff45, 0 0 45px #37eeff20;
      pointer-events: none;
    }
    .ring-window::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(
        from 15deg, var(--cyan) 0deg 250deg,
        #bb5aff 280deg, var(--pink) 300deg 345deg,
        var(--cyan) 360deg
      );
      animation: orbit 8s linear infinite;
    }
    .ring-window::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: inherit;
      background: radial-gradient(circle at 35% 25%, #102841, #061527 75%);
      box-shadow: inset 0 0 20px #37eeff12;
    }
    @keyframes orbit { to { transform: rotate(360deg); } }
    .card {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 950ms cubic-bezier(.22, .7, .2, 1);
    }
    .scene.is-flipped .card { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 38px 60px;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(1px);
    }
    .face--signup { transform: rotateY(180deg) translateZ(1px); }
    .face h1, .face h2 {
      margin: 0 0 23px;
      color: #fff;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: .15em;
      font-weight: 750;
      text-shadow: 0 0 15px #37eeff35;
    }
    .face h2 { font-size: 25px; margin-bottom: 16px; }
    .form { width: 100%; }
    .field { position: relative; display: block; margin-bottom: 13px; }
    .field input {
      width: 100%;
      min-height: 46px;
      padding: 11px 17px;
      border: 1px solid #71849a6b;
      border-radius: 999px;
      background: #ffffff05;
      color: #fff;
      outline: none;
      transition: border-color .22s, box-shadow .22s, background .22s;
    }
    .field input::placeholder { color: #b7c3d2; opacity: 1; }
    .field input:focus {
      border-color: var(--cyan);
      background: #37eeff08;
      box-shadow: 0 0 0 3px #37eeff16, inset 0 0 12px #37eeff06;
    }
    .field--password input { padding-right: 48px; }
    .visibility {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 7px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #c3d3df;
    }
    .visibility:hover { color: var(--cyan); background: #37eeff12; }
    .visibility svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .visibility[aria-pressed="true"] { color: var(--cyan); }
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 1px 3px 18px;
      color: var(--muted);
      font-size: 11px;
    }
    .remember { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .remember input { accent-color: var(--cyan); margin: 0; }
    .text-button {
      border: 0;
      padding: 0;
      background: none;
      color: var(--cyan);
      font-size: inherit;
      font-weight: 650;
    }
    .text-button:hover { text-decoration: underline; }
    .submit {
      position: relative;
      width: 100%;
      min-height: 44px;
      border: 1px solid #80f6ff;
      border-radius: 999px;
      background: linear-gradient(105deg, #20d9ee, #41f0ee);
      color: #042132;
      font-weight: 850;
      letter-spacing: .12em;
      box-shadow: 0 0 17px #37eeff28;
      transition: transform .18s, box-shadow .25s, filter .25s;
    }
    .submit:hover { box-shadow: 0 0 27px #37eeff6b; filter: brightness(1.07); transform: translateY(-2px); }
    .submit:active { transform: translateY(1px) scale(.985); }
    .switch-copy { margin: 15px 0 0; font-size: 12px; color: var(--muted); }
    .switch-copy button { margin-left: 4px; }
    .face--signup .field { margin-bottom: 9px; }
    .face--signup .field input { min-height: 42px; }
    .face--signup .submit { min-height: 41px; margin-top: 3px; }
    .face--signup .switch-copy { margin-top: 11px; }
    .caption { margin: 27px 0 0; color: #8ea7bf; font-size: 12px; }
    .status { min-height: 42px; margin: 12px 0 0; color: #b9f7f2; font-size: 13px; }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0);
      white-space: nowrap; border: 0;
    }
    @media (max-width: 420px) {
      body { padding-inline: 12px; }
      .face { padding: 28px 39px; }
      .face h1 { font-size: 25px; margin-bottom: 18px; }
      .field input { min-height: 42px; font-size: 13px; }
      .options { font-size: 10px; margin-bottom: 13px; }
      .face h2 { font-size: 22px; margin-bottom: 12px; }
      .face--signup .field input { min-height: 36px; padding-block: 8px; }
      .face--signup .field { margin-bottom: 7px; }
      .face--signup .submit { min-height: 36px; }
      .switch-copy { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring-window::before { animation: none; }
      .card, .field input, .submit { transition: none; }
    }
  </style>
</head>
<body>
  <a class="branding" href="https://codewithrishabh.rishabhmishra9619.workers.dev/">@codewithrishabh3596</a>
  <main class="demo">
    <div class="scene" id="scene">
      <div class="ring-window" aria-hidden="true"></div>
      <div class="card">
        <section class="face face--login" id="login-face" aria-labelledby="login-heading">
          <h1 id="login-heading">WELCOME</h1>
          <form class="form" id="login-form" autocomplete="off">
            <label class="field">
              <span class="sr-only">Email address</span>
              <input type="email" id="login-email" placeholder="Email address" autocomplete="off" required>
            </label>
            <label class="field field--password">
              <span class="sr-only">Password</span>
              <input type="password" id="login-password" placeholder="Password" autocomplete="off" required>
              <button class="visibility" type="button" data-password="login-password" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </label>
            <div class="options">
              <label class="remember"><input type="checkbox"> Remember me</label>
              <button type="button" class="text-button" id="forgot">Forgot password?</button>
            </div>
            <button class="submit" type="submit">LOGIN</button>
          </form>
          <p class="switch-copy">Don't have an account?<button class="text-button" type="button" id="show-signup">Sign Up</button></p>
        </section>
        <section class="face face--signup" id="signup-face" aria-labelledby="signup-heading" inert aria-hidden="true">
          <h2 id="signup-heading">JOIN US</h2>
          <form class="form" id="signup-form" autocomplete="off">
            <label class="field">
              <span class="sr-only">Full name</span>
              <input type="text" id="signup-name" placeholder="Full name" autocomplete="off" required>
            </label>
            <label class="field">
              <span class="sr-only">Email address</span>
              <input type="email" placeholder="Email address" autocomplete="off" required>
            </label>
            <label class="field field--password">
              <span class="sr-only">Create password</span>
              <input type="password" id="signup-password" placeholder="Create password" autocomplete="off" minlength="6" required>
              <button class="visibility" type="button" data-password="signup-password" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </label>
            <button class="submit" type="submit">SIGN UP</button>
          </form>
          <p class="switch-copy">Already a member?<button class="text-button" type="button" id="show-login">Log In</button></p>
        </section>
      </div>
    </div>
    <p class="caption">Frontend demo only. No information is sent or saved.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const scene = document.querySelector('#scene');
    const loginFace = document.querySelector('#login-face');
    const signupFace = document.querySelector('#signup-face');
    const status = document.querySelector('#status');
    let focusTimer;

    function flip(showSignup) {
      clearTimeout(focusTimer);
      // Move focus out before making the old face inaccessible.
      document.activeElement?.blur();
      scene.classList.toggle('is-flipped', showSignup);
      loginFace.inert = showSignup;
      signupFace.inert = !showSignup;
      loginFace.setAttribute('aria-hidden', String(showSignup));
      signupFace.setAttribute('aria-hidden', String(!showSignup));
      status.textContent = '';
      const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 950;
      focusTimer = setTimeout(() => {
        document.querySelector(showSignup ? '#signup-name' : '#login-email').focus();
      }, delay);
    }
    document.querySelector('#show-signup').addEventListener('click', () => flip(true));
    document.querySelector('#show-login').addEventListener('click', () => flip(false));

    document.querySelectorAll('[data-password]').forEach(button => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.password);
        const reveal = input.type === 'password';
        input.type = reveal ? 'text' : 'password';
        button.setAttribute('aria-pressed', String(reveal));
        button.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
      });
    });

    document.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', event => {
        event.preventDefault();
        status.textContent = 'Demo interaction complete. No account was created and no data was sent.';
      });
    });
    document.querySelector('#forgot').addEventListener('click', () => {
      status.textContent = 'Password recovery is not connected in this frontend demo.';
    });
  </script>
</body>
</html>
