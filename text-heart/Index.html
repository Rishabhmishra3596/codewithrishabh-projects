<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Heart Made of Words</title><style>body{margin:0;background:#08090d;color:white;font-family:system-ui;text-align:center}h1{font-size:24px}p{color:#ff7a25}canvas{display:block;width:min(100%,720px);margin:auto}pre{text-align:left;overflow:auto;margin:20px auto;padding:20px;background:#0d1117;max-width:680px;color:#d2d9e6}</style><h1>A Heart Made of Words</h1><p>@codewithrishabh3596</p><canvas width="720" height="570"></canvas><pre id="source"></pre><script>function drawTextHeart(ctx, seconds, width, height) {
  ctx.fillStyle = '#07080b';
  ctx.fillRect(0, 0, width, height);
  const turn = 0.48 * Math.sin(seconds * 0.7);
  const shape = a => [16*Math.sin(a)**3,
    -(13*Math.cos(a)-5*Math.cos(2*a)
      -2*Math.cos(3*a)-Math.cos(4*a))];
  const path = []; let length = 0, last;
  for (let i=0; i<=1000; i++) {
    const [x,y] = shape(i/1000*Math.PI*2);
    if(last) length += Math.hypot(x-last.x,y-last.y);
    path.push({x,y,length}); last={x,y};
  }
  const points = [], unit = Math.min(width,height)/46;
  for (let layer=0; layer<5; layer++) {
    for (let i=0; i<24; i++) {
      const p=path.find(p=>p.length >= i/24*length);
      const depth=(layer-2)*12;
      const z=-p.x*unit*Math.sin(turn)+depth*Math.cos(turn);
      const perspective=750/(750-z);
      const x=(p.x*unit*Math.cos(turn)+depth*Math.sin(turn))*perspective;
      const y=p.y*unit*perspective+(layer-2)*13;
      points.push({x,y,z});
    }
  }
  points.sort((a,b)=>a.z-b.z);
  for (const p of points) {
    ctx.save();
    ctx.translate(width/2+p.x,height/2+p.y-10);
    ctx.rotate(-0.48);
    ctx.font='12px DejaVu, sans-serif';
    ctx.textAlign='center';
    ctx.fillStyle=`rgba(245,158,201,${0.6+(p.z+120)/600})`;
    ctx.fillText('I love you',0,0);
    ctx.restore();
  }
}
