<body>
<div class="viewport"><main class="stage" id="stage">
<canvas id="ambient" width="1080" height="1920" aria-hidden="true"></canvas>
<div class="shape sphere one" aria-hidden="true"></div><div class="shape sphere two" aria-hidden="true"></div><div class="shape sphere three" aria-hidden="true"></div><div class="shape glass-ring" aria-hidden="true"></div><div class="shape glass-ring second" aria-hidden="true"></div>
  <div class="brand"><i></i>CODEWITHRISHABH / UI PROJECT</div>
  <h1 class="headline">A form that<br><span>feels like a chat.</span></h1>
  <div class="tag">Conversational contact form</div><div class="orb" aria-hidden="true"></div>
  <section class="card" aria-label="Contact form">
    <div class="card-top"><span class="mini-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m4 7 8 6 8-6"/></svg>LET’S CONNECT</span><span class="counter" id="counter">01 / 04</span></div>
    <div class="progress" id="progress"><i></i><i></i><i></i><i></i></div>
    <div id="content" class="content" aria-live="polite"></div>
  </section>
  <div class="below"><span class="dot"></span>HTML · CSS · JavaScript <span style="margin-left:14px;color:#aa98b3">Interactive demo</span></div>
  <div class="handle">@codewithrishabh3596</div>
  <svg id="cursor" class="cursor" viewBox="0 0 25 30" fill="none"><path d="M2 2v22l6-6 5 10 5-2-5-10h9L2 2Z" fill="#fff" stroke="#3d2c50" stroke-width="1.6" stroke-linejoin="round"/></svg><div id="ripple" class="ripple"></div>
</main></div>
<script>
const content=document.getElementById('content');const counter=document.getElementById('counter');
const progress=[...document.querySelectorAll('#progress i')];
const data={name:'',email:'',message:''};let step=0;let finished=false;
const bubble='<div class="avatar"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 5h18a4 4 0 0 1 4 4v11a4 4 0 0 1-4 4H14l-7 5v-5a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4Z"/><path d="M10 12h12M10 17h8"/></svg></div>';
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(focus=false){
counter.textContent=finished?'COMPLETE':String(step+1).padStart(2,'0')+' / 04';progress.forEach((el,i)=>el.classList.toggle('active',i<=step));content.className='content'+(step===3?' review':'')+(finished?' success':'');
if(finished){content.innerHTML='<div class="check"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 24 8 8 17-18"/></svg></div><h2>A little less form.<br>A lot more human.</h2><p>Your details are ready to review.<br>Three questions. One conversation.</p><button class="action" id="restart">Try it again <span class="arrow">↻</span></button><p class="demo-note">Demo complete · no message was sent</p>';document.getElementById('restart').onclick=()=>{step=0;finished=false;Object.keys(data).forEach(k=>data[k]='');show(true)};return;}
if(step===3){content.innerHTML=bubble+'<span class="greeting">Nice to meet you, '+escape(data.name)+'.</span><h2 class="question">Here’s your message.</h2><p class="description">One last look before you finish.</p><div class="summary"><div class="row"><span class="key">Name</span><span class="val">'+escape(data.name)+'</span></div><div class="row"><span class="key">Email</span><span class="val">'+escape(data.email)+'</span></div><div class="row"><div class="key">Your message</div><div class="val">'+escape(data.message)+'</div></div></div><button class="action" id="next">Looks good <span class="arrow">✓</span></button><p class="demo-note">Preview only · nothing is sent</p>';document.getElementById('next').onclick=()=>{finished=true;show(true)};return;}
const config=[['What should we<br>call you?','Let’s start with a name.','Your name','name','Type your name…','text'],['Where can we<br>reach you?','Your email keeps the conversation going.','Email address','email','you@example.com','email'],['What are you<br>working on?','Tell us a little about your project.','Your message','message','I’d love to build…','text']][step];
content.innerHTML=bubble+'<span class="greeting">'+(step===0?'A quick hello goes a long way.':'Hi, '+escape(data.name)+'.')+'</span><h2 class="question">'+config[0]+'</h2><p class="description">'+config[1]+'</p><form id="form" novalidate><label class="field-label" for="answer">'+config[2]+'</label>'+(step===2?'<textarea id="answer" maxlength="500" required placeholder="'+config[4]+'">'+escape(data[config[3]])+'</textarea>':'<input id="answer" type="'+config[5]+'" maxlength="'+(step===0?40:100)+'" required autocomplete="'+config[3]+'" placeholder="'+config[4]+'" value="'+escape(data[config[3]])+'">')+'<button class="action" type="submit" id="next">'+(step===2?'Review message':'Continue')+' <span class="arrow">↗</span></button><div id="error" class="error" role="alert"></div></form>'+(step>0?'<button class="back" id="back">← Previous question</button>':'');
document.getElementById('form').onsubmit=event=>{event.preventDefault();const input=document.getElementById('answer');const value=input.value.trim();if(!value||!input.checkValidity()){document.getElementById('error').textContent=step===1?'Please enter a valid email address.':'Please fill in your '+(step===0?'name':'message')+'.';input.focus();return;}data[config[3]]=value;step++;show(true)};
document.getElementById('answer').oninput=e=>{data[config[3]]=e.target.value;document.getElementById('error').textContent=''};if(step>0)document.getElementById('back').onclick=()=>{step--;show(true)};if(focus)document.getElementById('answer')?.focus();
}
show();
function resize(){document.documentElement.style.setProperty('--scale',Math.min(1,innerWidth/540))}resize();addEventListener('resize',resize);
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
// Deterministic playback of the same frontend states for the output-only reel.
window.renderAt=function(t){
document.body.classList.add('playing');data.name='Rishabh';data.email='rishabh@example.com';data.message='I’d love a portfolio website with smooth animations.';
step=t<3.2?0:t<6.8?1:t<10.5?2:3;finished=t>=14.1;
let localStart=[1,4.15,7.6][step];let duration=[1,1.7,2.0][step];let text=step===0?data.name:step===1?data.email:data.message;
show();if(step<3){document.getElementById('answer').value=text.slice(0,Math.floor(Math.max(0,Math.min(1,(t-localStart)/duration))*text.length));}
const stage=document.getElementById('stage');const boundaries=[0,3.2,6.8,10.5,14.1];const start=boundaries[finished?4:step];const age=t-start;
content.style.opacity=String(ease(age/.3));content.style.transform='translateY('+(1-ease(age/.3))*14+'px)';
const cursor=document.getElementById('cursor');const target=document.getElementById(finished?'restart':'next');const a=target.getBoundingClientRect(),b=stage.getBoundingClientRect();const scale=b.width/540;
const clickTimes=[2.85,6.45,10.15,13.8];let click=clickTimes[step];let hover=ease((t-(click-0.55))/.45);if(finished)hover=0;
const tx=(a.left-b.left+a.width*.78)/scale,ty=(a.top-b.top+a.height*.55)/scale;
cursor.style.display=t>.25&&!finished?'block':'none';cursor.style.left=(tx+(1-hover)*65)+'px';cursor.style.top=(ty+(1-hover)*75)+'px';
const ripple=document.getElementById('ripple');const delta=t-click;if(delta>=0&&delta<.3&&!finished){const size=20+delta*150;ripple.style.display='block';ripple.style.width=ripple.style.height=size+'px';ripple.style.left=(tx-size/2)+'px';ripple.style.top=(ty-size/2)+'px';ripple.style.opacity=String(1-delta/.3);target.style.background='#009abc';target.style.transform='scale(.985)';}else{ripple.style.display='none'}
animateScene(t);
};
window.resetDemo=function(){document.body.classList.remove('playing');step=0;finished=false;Object.keys(data).forEach(k=>data[k]='');content.style.opacity='1';content.style.transform='';document.getElementById('cursor').style.display='none';document.getElementById('ripple').style.display='none';show();};

const ambient=document.getElementById('ambient');const paint=ambient.getContext('2d');
function animateScene(t){
paint.clearRect(0,0,1080,1920);
const blobs=[[200+Math.sin(t*.35)*150,440+Math.cos(t*.26)*180,380,'#32d2ef'],[880+Math.cos(t*.28)*140,900+Math.sin(t*.32)*230,480,'#259dce'],[200+Math.sin(t*.4)*120,1570+Math.cos(t*.3)*170,390,'#236abd']];
for(const [x,y,r,c] of blobs){const g=paint.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c+'95');g.addColorStop(1,c+'00');paint.fillStyle=g;paint.fillRect(0,0,1080,1920)}
// Broad flowing liquid ribbons, with a reflective edge.
for(let j=0;j<3;j++){
const baseline=390+j*620;const flow=x=>baseline+110*Math.sin(x/260+t*.5+j)+36*Math.cos(x/105-t*.34);
const grad=paint.createLinearGradient(0,baseline-180,1080,baseline+180);grad.addColorStop(0,'#1bb5d500');grad.addColorStop(.28,'#25ceee38');grad.addColorStop(.55,'#a2f8ff62');grad.addColorStop(.8,'#198cae25');grad.addColorStop(1,'#6ceeff00');
paint.beginPath();for(let x=-80;x<1161;x+=8){const y=flow(x);if(x===-80)paint.moveTo(x,y);else paint.lineTo(x,y)}for(let x=1160;x>=-80;x-=8)paint.lineTo(x,flow(x)+66+Math.sin(x/170+t*.3)*35);paint.closePath();paint.fillStyle=grad;paint.fill();
const edge=paint.createLinearGradient(0,0,1080,0);edge.addColorStop(0,'#6af2ff00');edge.addColorStop(.3,'#c9ffffa0');edge.addColorStop(.6,'#56e3fbaa');edge.addColorStop(1,'#6af2ff00');paint.strokeStyle=edge;paint.lineWidth=3;paint.beginPath();for(let x=-80;x<1161;x+=8){if(x===-80)paint.moveTo(x,flow(x));else paint.lineTo(x,flow(x))}paint.stroke();
}
document.querySelector('.card')?.style.setProperty('--sheen',(380+Math.sin(t*.5)*520)+'px');

for(let j=0;j<22;j++){const x=(j*127+70+Math.sin(t*.6+j)*25)%1080;const y=(j*181+80-t*18+1920)%1920;paint.fillStyle=j%2?'#ffffffc0':'#69d8ed65';paint.beginPath();paint.arc(x,y,j%3===0?4:2,0,Math.PI*2);paint.fill()}
document.querySelectorAll('.sphere').forEach((el,j)=>{el.style.animation='none';el.style.transform='translate('+Math.sin(t*.6+j)*12+'px,'+Math.cos(t*.7+j)*20+'px)'});
document.querySelectorAll('.glass-ring').forEach((el,j)=>{el.style.transform='translateY('+Math.sin(t*.4+j)*20+'px) rotateX('+(44+Math.sin(t*.4)*9)+'deg) rotateY('+(j*22)+'deg) rotateZ('+(-28+t*4+j*42)+'deg)'});
}
let sceneFrame;let sceneStart=performance.now();function liveScene(now){if(!document.body.classList.contains('playing'))animateScene((now-sceneStart)/1000);sceneFrame=requestAnimationFrame(liveScene)}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)sceneFrame=requestAnimationFrame(liveScene);else animateScene(0);
window.showCover=function(){
document.querySelectorAll('.brand,.headline,.tag,.card,.below,.handle,.orb,#cursor,#ripple').forEach(el=>el.style.display='none');document.body.classList.add('playing');animateScene(4);
const cover=document.createElement('div');cover.className='cover-surface';cover.innerHTML=`<h1 class="cover-title"><span class="first">LIQUID GLASS</span><span class="second">CONTACT FORM</span></h1>
<div class="cover-bubble big"><div class="cover-avatar"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.8"><circle cx="20" cy="13" r="6"/><path d="M9 32v-4c0-9 22-9 22 0v4"/></svg></div><i class="cover-line a"></i><i class="cover-line b"></i><i class="cover-line c"></i><i class="cover-line d"></i></div>
<div class="cover-bubble small"><i class="cover-line a"></i><i class="cover-line b"></i><i class="cover-line c"></i></div>
<div class="cover-envelope"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><rect x="8" y="14" width="48" height="36" rx="8"/><path d="m10 19 22 16 22-16"/></svg></div>
<svg class="cover-spark" viewBox="0 0 40 40" fill="currentColor"><path d="M20 0c1 16 4 19 20 20-16 1-19 4-20 20-1-16-4-19-20-20C16 19 19 16 20 0Z"/></svg>
<div class="cover-handle">@codewithrishabh3596</div>`;document.getElementById('stage').appendChild(cover);scrollTo(0,0);
};
