if(typeof module!=="undefined")module.exports=ArtAssets;</script><script>const GalleryScene=(()=>{
 const duration=257/30,clamp=v=>Math.max(0,Math.min(1,v)),mix=(a,b,p)=>a+(b-a)*p;
 const ease=p=>1-Math.pow(1-clamp(p),3),smooth=p=>{p=clamp(p);return p*p*(3-2*p)};

 }
 function state(t){return{rise:ease((t-.08)/1.05),fan:ease((t-1.02)/.62),collapse:smooth((t-3.12)/.75),scroll1:smooth((t-3.15)/.8),spread:ease((t-4.05)/1.02),scroll2:smooth((t-6.35)/.9),third:ease((t-7.2)/.7)}}
 function card(i,x,y,r,w,a,h=w*1.27){return `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="6" fill="#000" opacity=".08" transform="translate(0 2)"/><image href="${a.cards[i]}" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cardClip)"/></g>`}
 function pill(x,y,label,c,rotation=0){return `<g transform="translate(${x} ${y}) rotate(${rotation})"><rect x="-29" y="-11" width="58" height="22" rx="11" fill="${c}"/>${text(0,4,label,10,'#fff','middle')}</g>`}
 function reveal(s,p){return s.slice(0,Math.ceil(s.length*clamp(p)))}
 function visual(t,a){const s=state(t);let out=`<svg xmlns="http://www.w3.org/2000/svg" width="674" height="404" viewBox="0 0 674 404"><defs><clipPath id="viewport"><rect width="674" height="404" rx="9"/></clipPath><clipPath id="cardClip" clipPathUnits="objectBoundingBox"><rect width="1" height="1" rx=".065"/></clipPath><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7f7fa"/><stop offset="1" stop-color="#f4f0f8"/></linearGradient></defs><g font-family="DejaVu Sans,sans-serif" clip-path="url(#viewport)"><rect width="674" height="404" fill="url(#paper)"/><path d="M-100 0Q320 250 750-10M-100 20Q340 270 750 15" fill="none" stroke="#fff" stroke-width="25" opacity=".2"/>`;
 const y1=-s.scroll1*335-s.scroll2*385;
 out+=`<g transform="translate(0 ${y1})">`;
 const hp=ease((t-.1)/.78);
 out+=text(337,108,reveal('A place to display your',hp),35,'#202026','middle',500,'letter-spacing="-1.8"')+text(337,146,reveal('masterpiece.',(t-.55)/.55),35,'#202026','middle',500,'letter-spacing="-1.8"');
 const fan=s.fan*(1-s.collapse), cx=mix(337,337,s.collapse), cy=mix(454,231,s.rise)+s.scroll1*335;
 for(let i=0;i<8;i++){const target=fanPosition(i,1),x=mix(cx,target.x,fan),y=cy+(target.y-231)*fan,rot=mix(-18,(i-3.5)*3.8,Math.max(s.rise*.85,fan));if(s.scroll1<.999)out+=card(i,x,y,rot,85,a)}
 const details=smooth((t-1.3)/.4)*(1-s.collapse);out+=`<g opacity="${details}">${pill(188,181,'@rishabh','#594bdf',-8)}${pill(540,190,'@studio','#4aa898',11)}${text(337,319,'Artists can display their masterpieces, and buyers can discover and',6.5,'#333','middle')}${text(337,331,'collect something extraordinary.',6.5,'#333','middle')}<rect x="271" y="350" width="73" height="19" rx="10" fill="#222"/>${text(307,362,'Join the gallery',5.5,'white','middle')}${text(360,362,'Read more',5.5)}</g></g>`;
 const y2=385*(1-s.scroll1)-s.scroll2*385;
 out+=`<g transform="translate(0 ${y2})">`;
 const lines=['Showcase, Sell,','& acquire arts to','our marketplace.'];lines.forEach((l,i)=>out+=text(47,91+i*36,reveal(l,(t-4.02-i*.13)/.35),32,i===1?'#653c69':'#242429','start',500,'letter-spacing="-1.4"'));
 out+=`<g opacity="${ease((t-4.4)/.65)}">${text(47,203,'Explore a community of original',7)}${text(47,215,'artworks, independent artists and',7)}${text(47,227,'inspiring creative collections.',7)}<rect x="47" y="263" width="76" height="20" rx="10" fill="#222"/>${text(85,276,'Explore artworks',6,'#fff','middle')}${text(136,276,'Learn more',6)}</g>`;
 // Re-form the hero stack into a descending diagonal gallery.
 for(let i=0;i<8;i++){const x=mix(337,318+i*86,s.spread),y=mix(231,280+i*28,s.spread);if(s.scroll1>.99)out+=card(i,x,y,mix(-18,0,s.spread),mix(85,134,s.spread),a,mix(107.95,134,s.spread))}
 out+=`<g opacity="${ease((t-4.7)/.5)}">${pill(350,185,'@create','#8b2552',-7)}${pill(530,245,'@art','#222',0)}${pill(630,283,'@collect','#6656eb',0)}</g></g>`;
 const y3=404*(1-s.scroll2);out+=`<g transform="translate(0 ${y3})">${text(47,63,'CREATE WITHOUT LIMITS',5.4,'#777','start',400,'letter-spacing="1.4"')}${text(47,106,reveal('Gateway to',(t-7.26)/.45),31,'#202026','start',500,'letter-spacing="-1.2"')}${text(47,139,reveal('artist people.',(t-7.66)/.43),31,'#202026','start',500,'letter-spacing="-1.2"')}<image href="${a.hero}" x="47" y="${mix(300,145,s.third)}" width="580" height="315" preserveAspectRatio="xMidYMid slice"/><rect x="60" y="157" width="9" height="19" rx="4" fill="#fff" opacity=".9"/></g>`;
 out+=`<rect width="674" height="49" fill="#f6f4f8" opacity=".97"/><path d="m35 26 7-7 7 7-7 7Z" fill="#6656eb"/>${text(57,30,'CodeWithRishabh',8.4,'#232329','start',700)}`;
 ['Get Started','Create strategy','Pricing','Contact','Solutions','E-Commerce'].forEach((l,i)=>out+=text(309+i*51,29,l,5.2,'#303034','middle'));
 out+=`<circle cx="611" cy="26" r="7" fill="#fff"/><circle cx="634" cy="26" r="7" fill="#fff"/>${text(611,28.5,'♙',8,'#555','middle')}${text(634,28,'☼',8,'#555','middle')}</g></svg>`;return out}
 function highlight(line){let result='',rx=/("[^"\n]*"|'[^'\n]*'|\b(?:const|return|function|let|if)\b|\b\d+(?:\.\d+)?\b|\/\/.*$)/g,last=0,m;while((m=rx.exec(line))){result+=esc(line.slice(last,m.index));const c=/^["']/.test(m[0])?'#b5e8a7':m[0].startsWith('//')?'#70869e':/^\d/.test(m[0])?'#f8ca7e':'#c6a5fa';result+=`<tspan fill="${c}">${esc(m[0])}</tspan>`;last=rx.lastIndex}return result+esc(line.slice(last))}
 function reel(t,a,code){const v=visual(t,a).replace(/<svg[^>]*>/,'').replace(/<\/svg>$/,'');let out=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 720 1280"><defs><clipPath id="codeBounds"><rect x="57" y="919" width="638" height="361"/></clipPath></defs><rect width="720" height="1280" fill="#000"/><g font-family="DejaVu Sans,sans-serif"><g transform="translate(360 0) scale(.85 1) translate(-360 0)">${text(360,268,'Animated',64,'#fff','middle',400,'font-stretch="condensed"')}${text(360,355,'Website UI',68,'#35e1ff','middle',400,'font-stretch="condensed"')}</g><rect x="0" y="436" width="720" height="409" fill="#39363e"/><g transform="translate(23 439)">${v}</g><rect x="10" y="858" width="700" height="422" rx="14" fill="#10151e" stroke="#54697c"/><path d="M10 901H710" stroke="#2b3a49"/><circle cx="29" cy="879" r="6" fill="#ff6868"/><circle cx="48" cy="879" r="6" fill="#ffc25f"/><circle cx="67" cy="879" r="6" fill="#68dc8b"/><rect x="87" y="861" width="183" height="39" rx="6" fill="#233040"/>${text(99,885,'JS  gallery.js',13,'#c8edff')}${text(688,884,'CodeWithRishabh',14,'#8de8f9','end',700)}<rect x="11" y="902" width="34" height="378" fill="#151c27"/>${text(27,928,'▤',19,'#748397','middle')}${text(27,966,'⌕',23,'#748397','middle')}${text(27,1007,'⑂',23,'#748397','middle')}${text(27,1048,'▷',23,'#748397','middle')}</g><g font-family="DejaVu Sans Mono,monospace" font-size="12.8" xml:space="preserve">`;
 code.split('\n').slice(0,16).forEach((line,i)=>{out+=text(66,933+i*22,String(i+1),11,'#6e8193','end')+`<text x="80" y="${933+i*22}" fill="#d7e4ef" clip-path="url(#codeBounds)">${highlight(line)}</text>`});return out+'</g></svg>'}
 return {duration,state,visual,reel,fanPosition};
})();if(typeof module!=='undefined')module.exports=GalleryScene;
</script><script>function renderAtTime(seconds) {
  preview.innerHTML = GalleryScene.visual(seconds, ArtAssets);
}
window.renderAtTime = renderAtTime;
let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, time = 0, previous = 0;
const preview = document.getElementById('preview');
const seek = document.getElementById('seek');
const play = document.getElementById('play');
play.textContent = playing ? 'Pause' : 'Play';
play.addEventListener('click', () => {
  playing = !playing;
  play.textContent = playing ? 'Pause' : 'Play';
});
seek.addEventListener('input', () => {
  time = Number(seek.value);
  playing = false;
  play.textContent = 'Play';
  renderAtTime(time);
});
document.querySelectorAll('[data-time]').forEach(button => {
  button.addEventListener('click', () => {
    time = Number(button.dataset.time);
    renderAtTime(time);
  });
});
preview.addEventListener('wheel', event => {
  event.preventDefault();
  playing = false;
  play.textContent = 'Play';
  time = Math.max(0, Math.min(GalleryScene.duration - 1/30, time + event.deltaY * .004));
  seek.value = time;
  renderAtTime(time);
}, {passive: false});
function tick(now) {
  if (previous && playing) time = (time + Math.min((now - previous)/1000, .1)) % GalleryScene.duration;
  previous = now;
  seek.value = time;
  renderAtTime(time);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
