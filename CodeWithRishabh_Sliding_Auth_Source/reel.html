<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auth Form — Synchronized Build</title><style>body{margin:0;background:#eaf0ff;font-family:Arial;color:#193756}#stage{max-width:540px;margin:auto}svg{display:block;width:100%;height:auto}nav{display:flex;justify-content:center;gap:12px;padding:15px}input{width:240px}</style></head><body><div id="stage"></div><nav><button id="play">Pause</button><input id="seek" aria-label="Reel time" type="range" min="0" max="24" step="0.033333" value="0"></nav><script src="code-data.js"></script><script src="reel.js"></script><script>let playing=true,now=0,last=performance.now();const stage=document.querySelector('#stage'),seek=document.querySelector('#seek'),button=document.querySelector('#play');function draw(t){stage.innerHTML=AuthReel.svg(t);seek.value=t}window.renderAtTime=t=>{playing=false;now=Math.max(0,Math.min(23.999,t));draw(now);button.textContent='Play'};window.__sceneReady=true;button.onclick=()=>{playing=!playing;button.textContent=playing?'Pause':'Play';last=performance.now()};seek.oninput=()=>renderAtTime(Number(seek.value));function frame(t){if(playing){now=(now+(t-last)/1000)%24;draw(now)}last=t;requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
