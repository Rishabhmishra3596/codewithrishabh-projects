bsolute;bottom:20px;left:0;right:0;text-align:center;color:#666e7c;font-size:11px;text-decoration:none}#dust{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .8s}body[data-on="true"] #dust{opacity:1}[hidden]{display:none!important}

<script>
const body=document.body,cord=document.querySelector('#pullCord'),card=document.querySelector('#loginCard'),notice=document.querySelector('#notice');
let isOn=false,startY=null,drag=0,pointer=null;
function setLight(value){
 isOn=value;body.dataset.on=String(value);card.inert=!value;card.setAttribute('aria-hidden',String(!value));cord.setAttribute('aria-pressed',String(value));cord.setAttribute('aria-label',value?'Turn off the lamp':'Turn on the lamp');
 if(!value&&card.contains(document.activeElement))cord.focus();
 if(value)startDust();else stopDust();
}
function release(cancelled=false){
 if(startY===null)return;
 const shouldToggle=!cancelled;startY=null;pointer=null;cord.classList.remove('dragging');cord.style.setProperty('--pull','0px');
 if(shouldToggle)setLight(!isOn);
}
cord.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;startY=e.clientY;drag=0;pointer=e.pointerId;cord.setPointerCapture(pointer);cord.classList.add('dragging');});
cord.addEventListener('pointermove',e=>{if(startY===null||e.pointerId!==pointer)return;drag=Math.max(0,Math.min(60,e.clientY-startY));cord.style.setProperty('--pull',drag+'px');});
cord.addEventListener('pointerup',e=>{if(e.pointerId!==pointer)return;release();});
cord.addEventListener('pointercancel',()=>release(true));cord.addEventListener('lostpointercapture',()=>release(true));
cord.addEventListener('click',e=>{if(e.detail===0)setLight(!isOn);});
const tabs=[document.querySelector('#signInTab'),document.querySelector('#signUpTab')],form=document.querySelector('#accountPanel'),email=document.querySelector('#email'),password=document.querySelector('#password');
let signUp=false;
function setMode(value){signUp=value;tabs.forEach((t,i)=>{t.setAttribute('aria-selected',String(i===Number(value)));t.tabIndex=i===Number(value)?0:-1;});document.querySelector('#heading').textContent=value?'Create account':'Welcome';document.querySelector('#subtitle').textContent=value?'Start your journey with us':'Sign in to continue to your account';document.querySelector('#emailField').hidden=!value;email.disabled=!value;email.required=value;document.querySelector('#forgot').hidden=value;document.querySelector('#rememberRow').hidden=value;password.autocomplete=value?'new-password':'current-password';password.minLength=value?8:1;document.querySelector('#submitText').textContent=value?'Sign Up':'Sign In';form.setAttribute('aria-labelledby',value?'signUpTab':'signInTab');notice.textContent='';}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>setMode(Boolean(i)));t.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const index=e.key==='Home'?0:e.key==='End'?1:1-Number(signUp);setMode(Boolean(index));tabs[index].focus();});});
document.querySelector('#eye').addEventListener('click',e=>{const show=password.type==='password';password.type=show?'text':'password';e.currentTarget.setAttribute('aria-pressed',String(show));e.currentTarget.setAttribute('aria-label',show?'Hide password':'Show password');});
form.addEventListener('submit',e=>{e.preventDefault();notice.textContent='Demo only — no data sent, saved, or account created.';form.reset();password.type='password';document.querySelector('#eye').setAttribute('aria-pressed','false');document.querySelector('#eye').setAttribute('aria-label','Show password');});
document.querySelector('#forgot').addEventListener('click',()=>notice.textContent='Password recovery requires a connected backend.');document.querySelectorAll('.socials button').forEach(b=>b.addEventListener('click',()=>notice.textContent='Social sign-in is a visual demo; no provider is connected.'));
const canvas=document.querySelector('#dust'),ctx=canvas.getContext('2d'),motion=matchMedia('(prefers-reduced-motion: reduce)');let dustFrame=0,last=0,width=0,height=0;
const particles=Array.from({length:38},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.1,s:.005+Math.random()*.009}));
function resize(){width=innerWidth;height=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function draw(time){if(!isOn||motion.matches||document.hidden){dustFrame=0;last=0;return;}const dt=last?Math.min((time-last)/1000,.05):0;last=time;ctx.clearRect(0,0,width,height);for(const p of particles){p.y-=p.s*dt;if(p.y<0)p.y=1;ctx.beginPath();ctx.fillStyle='rgba(255,213,131,.18)';ctx.arc(p.x*width,p.y*height,p.r,0,Math.PI*2);ctx.fill();}dustFrame=requestAnimationFrame(draw);}
function startDust(){if(!dustFrame&&!motion.matches&&!document.hidden)dustFrame=requestAnimationFrame(draw);}
function stopDust(){cancelAnimationFrame(dustFrame);dustFrame=0;last=0;ctx.clearRect(0,0,width,height);}
addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopDust();else if(isOn)startDust();});motion.addEventListener('change',()=>{if(motion.matches)stopDust();else if(isOn)startDust();});resize();
</script>
