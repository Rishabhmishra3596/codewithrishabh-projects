<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sneaker Studio — CodeWithRishabh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="studio">
    <canvas id="scene" width="941" height="1672" aria-label="Sneaker Studio animated showcase"></canvas>
    <div class="swatches" aria-label="Choose a shoe colour">
      <button data-color="0" aria-label="Cobalt blue"></button>
      <button data-color="1" aria-label="Coral"></button>
      <button data-color="2" aria-label="Charcoal"></button>
    </div>
    <button id="explore" aria-label="Explore shoe features"></button>
  </main>
  <script src="script.js"></script>
</body>
</html>
