:root {
  --accent: #b497ff;
  --secondary: #6dd8ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-content: center;
  background: #090d13;
  font-family: LampSans, Arial, sans-serif;
}
#frame { width: min(96vw, 1100px); aspect-ratio: 645 / 365; position: relative; }
#stage { position: absolute; width: 645px; height: 365px; transform-origin: top left; }
#art, #controls { position: absolute; inset: 0; margin: 0; }
#art svg { width: 645px; height: 365px; display: block; }
.hit { position: absolute; border: 0; padding: 0; color: transparent; background: transparent; cursor: pointer; }
.hit:focus-visible, .field:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.cord { left: 123px; top: 164px; width: 26px; height: 68px; touch-action: none; cursor: grab; }
.cord:active { cursor: grabbing; }
.theme { top: 14px; width: 12px; height: 17px; border-radius: 50%; }
.theme[data-theme="0"] { left: 532px; }
.theme[data-theme="1"] { left: 544px; }
.theme[data-theme="2"] { left: 556px; }
.theme[data-theme="3"] { left: 568px; }
.theme[data-theme="4"] { left: 580px; }
.sound { left: 610px; top: 12px; width: 20px; height: 21px; }
.tab-signin { left: 312px; top: 98px; width: 86px; height: 20px; }
.tab-signup { left: 398px; top: 98px; width: 86px; height: 20px; }
.field {
  position: absolute;
  left: 312px;
  width: 172px;
  height: 23px;
  border: .6px solid transparent;
  border-radius: 7px;
  background: transparent;
  padding: 0 20px 0 23px;
  color: #eff1f7;
  font: 7px LampSans, Arial, sans-serif;
}
.field::placeholder { color: #687183; }
.field:focus { border-color: var(--accent); outline: none; }
#email { top: 145px; }
#password { top: 193px; }
.show-password { left: 462px; top: 193px; width: 22px; height: 23px; }
.forgot { left: 454px; top: 178px; width: 30px; height: 13px; }
.remember-label { left: 312px; top: 224px; width: 85px; height: 13px; }
#remember { appearance: none; position: absolute; inset: 0; margin: 0; cursor: pointer; }
#remember:focus-visible { outline: 1px solid var(--accent); }
.submit-btn {
  position: absolute;
  left: 312px;
  top: 245px;
  width: 172px;
  height: 24px;
  border: none;
  border-radius: 7px;
  background: linear-gradient(135deg,
    var(--accent), var(--secondary));
  color: #10172a;
  font-family: LampSans, Arial, sans-serif;
  font-size: 7.5px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .35s ease;
}
.submit-btn:hover { transform: translateY(-1px); }
.submit-btn:active { transform: translateY(0); }
.submit-btn:focus-visible { outline: 1px solid white; outline-offset: 2px; }
.submit-btn:disabled { cursor: wait; color: transparent; background: transparent; }
.social { top: 298px; width: 54px; height: 21px; }
.google { left: 312px; }
.github { left: 371px; }
.apple { left: 430px; }
.reset { left: 365px; top: 216px; width: 66px; height: 18px; }
.credit { color: #a8b2c7; font-size: 12px; text-align: center; margin: 20px 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

#controls { pointer-events: none; }
#controls > * { pointer-events: auto; }

</style>

  <script>const state = {
