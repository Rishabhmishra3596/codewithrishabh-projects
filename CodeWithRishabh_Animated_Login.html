<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Login | CodeWithRishabh</title>
  <style>
    :root { --emerald:#087f68; --background:#dde4ed; --text:#252b28; --ease:cubic-bezier(.22,1,.36,1); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100svh; display:grid; place-items:center; padding:80px 24px; background:var(--background); color:var(--text); font-family:Arial,sans-serif; }
    .brand { position:absolute; top:28px; left:28px; color:var(--emerald); font-size:18px; font-weight:800; text-decoration:none; }
    .auth { position:relative; width:min(960px,100%); height:620px; overflow:hidden; background:white; border-radius:24px; box-shadow:0 18px 45px #182b3426; isolation:isolate; }
    .form-panel { position:absolute; top:0; width:50%; height:100%; display:flex; align-items:center; padding:38px 42px; transition:opacity .3s ease,transform .65s var(--ease),visibility 0s; }
    .login { right:0; }
    .register { left:0; opacity:0; visibility:hidden; pointer-events:none; transform:translateX(-24px); }
    .auth.active .login { opacity:0; visibility:hidden; pointer-events:none; transform:translateX(24px); transition-delay:0s,0s,.3s; }
    .auth.active .register { opacity:1; visibility:visible; pointer-events:auto; transform:translateX(0); transition-delay:.3s,.3s,0s; }
    form { width:100%; text-align:center; }
    h1 { margin-bottom:42px; font-size:38px; letter-spacing:-.8px; }
    .register h1 { margin-bottom:30px; }
    .field { position:relative; display:block; margin-bottom:26px; }
    input { width:100%; height:54px; padding:0 48px 0 18px; border:2px solid transparent; border-radius:8px; outline:none; background:#f0f3f1; color:var(--text); font:inherit; font-size:16px; transition:border-color .25s,box-shadow .25s,background .25s; }
    input::placeholder { color:#87918b; }
    input:focus { border-color:var(--emerald); background:white; box-shadow:0 0 0 4px #087f6812; }
    .field svg { position:absolute; top:17px; right:17px; width:20px; height:20px; fill:none; stroke:#39463f; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
    button { font:inherit; cursor:pointer; }
    .forgot { display:inline-block; margin:1px 0 28px; border:0; background:transparent; color:#535d57; font-size:14px; }
    .submit { width:100%; height:55px; border:0; border-radius:8px; background:var(--emerald); color:white; font-size:18px; font-weight:700; transition:background .2s,transform .2s,box-shadow .2s; }
    .submit:hover { background:#066b57; box-shadow:0 8px 20px #087f682b; transform:translateY(-2px); }
    .submit:active { transform:translateY(1px); }
    .social-label { margin:26px 0 18px; color:#59635d; font-size:14px; }
    .socials { display:flex; justify-content:center; gap:14px; }
    .socials button { width:46px; height:42px; border:1px solid #c6ceca; border-radius:6px; background:white; color:#344139; font-size:17px; font-weight:700; transition:color .2s,border-color .2s,transform .2s; }
    .socials button:hover { color:var(--emerald); border-color:var(--emerald); transform:translateY(-3px); }
    /* An oversized rounded shape creates the curved slide. */
    .welcome { position:absolute; z-index:2; top:0; left:-250%; width:300%; height:100%; border-radius:200px; background:var(--emerald); pointer-events:none; transition:left 1s var(--ease); }
    .auth.active .welcome { left:50%; }
    .welcome-panel { position:absolute; z-index:3; top:0; width:50%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:32px; color:white; text-align:center; transition:transform .65s var(--ease),opacity .3s ease,visibility 0s; }
    .welcome-panel h2 { margin-bottom:14px; font-size:35px; letter-spacing:-.6px; }
    .welcome-panel p { margin-bottom:30px; color:#e0f2e9; font-size:17px; }
    .switch { width:190px; height:54px; border:2px solid #e2f3ed; border-radius:8px; background:transparent; color:white; font-size:18px; font-weight:700; transition:background .2s,transform .2s; }
    .switch:hover { background:#ffffff18; transform:translateY(-2px); }
    .welcome-left { left:0; }
    .welcome-right { right:0; opacity:0; visibility:hidden; pointer-events:none; transform:translateX(110%); }
    .auth.active .welcome-left { opacity:0; visibility:hidden; pointer-events:none; transform:translateX(-110%); transition-delay:0s,0s,.3s; }
    .auth.active .welcome-right { opacity:1; visibility:visible; pointer-events:auto; transform:translateX(0); transition-delay:.15s,.15s,0s; }
    .status { position:absolute; z-index:5; bottom:12px; left:50%; width:90%; transform:translateX(-50%); color:#344139; text-align:center; font-size:12px; pointer-events:none; }
    button:focus-visible,a:focus-visible { outline:3px solid #50cbaa; outline-offset:5px; }
    .footer { position:fixed; bottom:20px; color:#52665a; font-size:13px; text-decoration:none; }
    @media (max-width:680px) {
      body { padding:80px 16px 65px; }
      .brand { top:24px; left:20px; font-size:16px; }
      .auth { height:760px; }
      .form-panel { top:220px; left:0; right:auto; width:100%; height:540px; padding:30px; }
      h1 { margin-bottom:30px; font-size:34px; }
      .field { margin-bottom:20px; }
      .welcome,.auth.active .welcome { top:0; left:0; width:100%; height:220px; border-radius:0 0 70px 70px; }
      .welcome-panel { width:100%; height:220px; padding:20px; }
      .welcome-panel h2 { margin-bottom:8px; font-size:28px; }
      .welcome-panel p { margin-bottom:18px; font-size:15px; }
      .switch { width:165px; height:45px; font-size:16px; }
      .status { bottom:8px; }
      .footer { position:absolute; bottom:18px; max-width:90%; text-align:center; overflow-wrap:anywhere; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { transition-duration:.01ms !important; transition-delay:0s !important; }
    }
  </style>
</head>
<body>
  <a class="brand" href="https://codewithrishabh.rishabhmishra9619.workers.dev/">@codewithrishabh3596</a>

  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <symbol id="user-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></symbol>
      <symbol id="lock-icon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V6a4 4 0 0 1 8 0v4"></path></symbol>
      <symbol id="email-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 6 9 7 9-7"></path></symbol>
    </defs>
  </svg>

  <main class="auth" id="auth" aria-label="Login and registration">
    <section class="form-panel login" id="loginPanel">
      <form id="loginForm">
        <h1>Login</h1>
        <label class="field"><input type="text" name="username" placeholder="Username" aria-label="Username" autocomplete="username" required><svg aria-hidden="true"><use href="#user-icon"></use></svg></label>
        <label class="field"><input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required><svg aria-hidden="true"><use href="#lock-icon"></use></svg></label>
        <button class="forgot" type="button">Forgot Password?</button>
        <button class="submit" type="submit">Login</button>
        <p class="social-label">or login with social platforms</p>
        <div class="socials" aria-label="Social login demos">
          <button type="button" aria-label="Google demo">G</button><button type="button" aria-label="Facebook demo">f</button><button type="button" aria-label="GitHub demo">GH</button><button type="button" aria-label="LinkedIn demo">in</button>
        </div>
      </form>
    </section>

    <section class="form-panel register" id="registerPanel" inert aria-hidden="true">
      <form id="registerForm">
        <h1>Registration</h1>
        <label class="field"><input type="text" name="username" placeholder="Username" aria-label="Username" autocomplete="username" required><svg aria-hidden="true"><use href="#user-icon"></use></svg></label>
        <label class="field"><input type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email" required><svg aria-hidden="true"><use href="#email-icon"></use></svg></label>
        <label class="field"><input type="password" name="password" placeholder="Password" aria-label="Create a password" autocomplete="new-password" minlength="8" required><svg aria-hidden="true"><use href="#lock-icon"></use></svg></label>
        <button class="submit" type="submit">Register</button>
        <p class="social-label">or register with social platforms</p>
        <div class="socials" aria-label="Social registration demos">
          <button type="button" aria-label="Google demo">G</button><button type="button" aria-label="Facebook demo">f</button><button type="button" aria-label="GitHub demo">GH</button><button type="button" aria-label="LinkedIn demo">in</button>
        </div>
      </form>
    </section>

    <div class="welcome" aria-hidden="true"></div>
    <section class="welcome-panel welcome-left" id="welcomeLeft">
      <h2>Hello, Welcome!</h2><p>Don't have an account?</p>
      <button class="switch" id="toRegister" type="button" aria-controls="registerPanel">Register</button>
    </section>
    <section class="welcome-panel welcome-right" id="welcomeRight" inert aria-hidden="true">
      <h2>Welcome Back!</h2><p>Already have an account?</p>
      <button class="switch" id="toLogin" type="button" aria-controls="loginPanel">Login</button>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <a class="footer" href="https://codewithrishabh.rishabhmishra9619.workers.dev/">More projects by CodeWithRishabh</a>
  <script>
    const auth = document.querySelector('#auth');
    const loginPanel = document.querySelector('#loginPanel');
    const registerPanel = document.querySelector('#registerPanel');
    const welcomeLeft = document.querySelector('#welcomeLeft');
    const welcomeRight = document.querySelector('#welcomeRight');
    const toRegister = document.querySelector('#toRegister');
    const toLogin = document.querySelector('#toLogin');
    const status = document.querySelector('#status');
    let focusTimer;

    function setVisible(element, visible) {
      element.inert = !visible;
      element.setAttribute('aria-hidden', String(!visible));
    }

    function switchForm(showRegistration) {
      clearTimeout(focusTimer);
      status.textContent = '';
      const destination = showRegistration ? toLogin : toRegister;
      setVisible(showRegistration ? welcomeRight : welcomeLeft, true);
      auth.classList.toggle('active', showRegistration);
      destination.focus({ preventScroll: true });
      setVisible(loginPanel, !showRegistration);
      setVisible(registerPanel, showRegistration);
      setVisible(welcomeLeft, !showRegistration);
      setVisible(welcomeRight, showRegistration);
      const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1000;
      focusTimer = setTimeout(() => {
        const panel = showRegistration ? registerPanel : loginPanel;
        panel.querySelector('input').focus({ preventScroll: true });
      }, delay);
    }

    toRegister.addEventListener('click', () => switchForm(true));
    toLogin.addEventListener('click', () => switchForm(false));
    document.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', event => {
        event.preventDefault();
        status.textContent = 'Frontend demo only — no account created or data sent.';
        form.reset();
      });
    });
    document.querySelector('.forgot').addEventListener('click', () => {
      status.textContent = 'Password recovery requires a connected backend.';
    });
    document.querySelectorAll('.socials button').forEach(button => {
      button.addEventListener('click', () => {
        status.textContent = 'Social sign-in is a visual demo; no provider is connected.';
      });
    });
  </script>
</body>
</html>
