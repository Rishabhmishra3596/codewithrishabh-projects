<!DOCTYPE html>
<!-- Glass Login — @codewithrishabh3596 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* STEP 1: dark gradient + two glowing blobs */
  .bg {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #1e1b4b, #0f172a);
    position: relative;
    overflow: hidden;
    padding: 24px;
  }
  .blob {
    position: absolute;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    filter: blur(60px);
    animation: float 8s ease-in-out infinite alternate;
  }
  .blob.pink { background: #ec4899; top: calc(50% - 260px); left: calc(50% - 320px); }
  .blob.cyan { background: #06b6d4; top: calc(50% - 40px);  left: calc(50% - 20px); animation-delay: -4s; }
  @keyframes float {
    to { transform: translate(40px, -30px) scale(1.08); }
  }

  /* STEP 2: semi-transparent card + backdrop blur */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    padding: 40px 36px;
    background: rgba(255, 255, 255, .1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 28px;

    /* STEP 3: thin border + soft shadow */
    border: 1px solid rgba(255, 255, 255, .25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .35);
  }

  .card h1 {
    font: 800 32px 'Poppins', sans-serif;
    color: #fff;
    margin-bottom: 6px;
  }
  .card p {
    font: 400 14px 'JetBrains Mono', monospace;
    color: rgba(255, 255, 255, .7);
    margin-bottom: 28px;
  }
  .card input {
    width: 100%;
    padding: 16px 18px;
    margin-bottom: 14px;
    font: 400 15px 'JetBrains Mono', monospace;
    color: #fff;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: 12px;
    outline: none;
    transition: border-color .2s, background .2s;
  }
  .card input::placeholder { color: rgba(255, 255, 255, .55); }
  .card input:focus {
    border-color: rgba(255, 255, 255, .55);
    background: rgba(255, 255, 255, .18);
  }
  .card button {
    width: 100%;
    margin-top: 6px;
    padding: 16px;
    font: 700 17px 'Poppins', sans-serif;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(90deg, #8b5cf6, #06b6d4);
    box-shadow: 0 8px 24px rgba(139, 92, 246, .35);
    transition: transform .15s, box-shadow .2s;
  }
  .card button:hover  { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(6, 182, 212, .4); }
  .card button:active { transform: translateY(0); }
</style>
</head>
<body>
  <main class="bg">
    <div class="blob pink"></div>
    <div class="blob cyan"></div>

    <form class="card" onsubmit="event.preventDefault(); this.querySelector('button').textContent = 'Welcome ✓';">
      <h1>Welcome back</h1>
      <p>Log in to continue</p>
      <input type="email" placeholder="you@example.com" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
