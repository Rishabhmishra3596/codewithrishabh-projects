<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Diagonal Login | CodeWithRishabh</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:#04090f;color:#f8fbfc;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}.scene{width:min(850px,100%)}.brand{margin:0 0 20px;color:#b6d7de;font-size:13px;letter-spacing:.035em}.card{position:relative;min-height:510px;overflow:hidden;border:1px solid #65ebf4;background:#04090f;box-shadow:0 0 30px #0cddea16}.diagonal{position:absolute;inset:0;background:linear-gradient(45deg,#05242f,#078999);clip-path:polygon(60% 0,100% 0,100% 100%);transition:clip-path 1.1s cubic-bezier(.7,0,.25,1);animation:reveal 1.2s both}.welcome{position:absolute;right:3%;top:42%;width:25%;text-align:center;transition:transform .9s,opacity .4s}.welcome h2{font-size:29px;line-height:1.15;margin:0}.welcome p{font-size:13px;line-height:1.6;color:#cefaff}.form{position:relative;width:51%;padding:42px 42px 34px;transition:opacity .4s,transform .8s}.form h1{text-align:center;font-size:31px;margin:0 0 35px}.field{display:flex;align-items:center;border-bottom:1px solid #f2ffffb8;margin:27px 0;position:relative}.field input{width:100%;padding:13px 30px 12px 0;border:0;outline:0;background:transparent;color:white}.field input::placeholder{color:#e8eeee}.field:focus-within{border-color:#55e6ef}.field svg{width:17px;height:17px;fill:currentColor;flex-shrink:0}.eye{border:0;color:inherit;background:none;padding:6px;position:absolute;right:-6px}.submit{width:100%;border:1px solid #98f4fa;border-radius:28px;background:linear-gradient(#03b8c8,#004451);padding:11px;color:white;font-weight:700;box-shadow:inset 0 1px #ffffff55;transition:filter .2s,transform .2s}.submit:hover{filter:brightness(1.2);transform:translateY(-2px)}.submit:active{transform:translateY(1px)}.switch{text-align:center;font-size:13px;line-height:1.7;margin:20px 0 0}.switch button{display:block;margin:auto;background:transparent;color:#62e9f4;border:0;font-weight:700;padding:2px;font-size:15px}.signup{position:absolute;right:0;top:0;opacity:0;pointer-events:none;transform:translateX(40px);padding-top:27px}.signup h1{margin-bottom:15px}.signup .field{margin:15px 0}.status{min-height:30px;font-size:12px;line-height:1.5;color:#9aeff5;margin:10px 0 0}.footnote{font-size:11px;color:#8198a6;margin-top:16px}.card[data-mode="signup"] .diagonal{clip-path:polygon(0 0,40% 0,0 100%)}.card[data-mode="signup"] .welcome{transform:translateX(-270%)}.card[data-mode="signup"] .login{opacity:0;pointer-events:none;transform:translateX(-40px)}.card[data-mode="signup"] .signup{opacity:1;pointer-events:auto;transform:none}.card.ready .login>*{animation:arrive .7s both}.card.ready .login>:nth-child(2){animation-delay:.1s}.card.ready .login>:nth-child(3){animation-delay:.2s}.card.ready .login>:nth-child(4){animation-delay:.3s}.card.ready .login>:nth-child(5){animation-delay:.4s}@keyframes reveal{from{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}to{clip-path:polygon(60% 0,100% 0,100% 100%,100% 100%)}}@keyframes arrive{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}:focus-visible{outline:2px solid #8ff9ff;outline-offset:4px}@media(max-width:650px){body{padding:18px}.card{min-height:600px}.diagonal{clip-path:polygon(0 0,100% 0,100% 24%,0 12%);animation:none}.welcome{top:24px;right:8%;width:84%;text-align:right}.welcome h2{font-size:23px}.welcome p{display:none}.form{width:100%;padding:155px 28px 25px}.signup{padding-top:155px}.card[data-mode="signup"] .diagonal{clip-path:polygon(0 0,100% 0,100% 12%,0 24%)}.card[data-mode="signup"] .welcome{transform:none;text-align:left}.form h1{font-size:27px;margin-bottom:23px}.signup .field{margin:15px 0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="scene">
<p class="brand">@codewithrishabh3596</p>
<section class="card" data-mode="login" aria-label="Account access">
<div class="diagonal" aria-hidden="true"></div>
<aside class="welcome"><h2>WELCOME<br>BACK!</h2><p>Good to see you again.</p></aside>
<form class="form login" id="login-form">
<h1>Login</h1>
<label class="field"><input name="username" placeholder="Username" aria-label="Username" autocomplete="username" required><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM4 22v-3a8 8 0 0 1 16 0v3Z"/></svg></label>
<label class="field"><input name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required><button class="eye" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V7a6 6 0 0 1 12 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Zm2 0h8V7a4 4 0 0 0-8 0Z"/></svg></button></label>
<button class="submit">Login</button>
<p class="switch">Don't have an account?<button type="button" data-switch="signup">Sign Up</button></p>
<p class="status" role="status"></p>
</form>
<form class="form signup" id="signup-form" inert>
<h1>Sign Up</h1>
<label class="field"><input name="username" placeholder="Username" aria-label="Username" autocomplete="username" required></label>
<label class="field"><input name="email" type="email" placeholder="Email" aria-label="Email" autocomplete="email" required></label>
<label class="field"><input name="password" type="password" minlength="8" placeholder="Password" aria-label="Password (at least 8 characters)" autocomplete="new-password" required><button class="eye" type="button" aria-label="Show password" aria-pressed="false">◉</button></label>
<button class="submit">Create Account</button>
<p class="switch">Already have an account?<button type="button" data-switch="login">Login</button></p>
<p class="status" role="status"></p>
</form>
</section>
<p class="footnote">Frontend demo. No credentials are sent or stored.</p>
</main>
<script>
const card=document.querySelector('.card');
const forms=[...document.querySelectorAll('form')];
document.querySelector('.diagonal').addEventListener('animationend',event=>{event.currentTarget.style.animation='none';},{once:true});
requestAnimationFrame(()=>card.classList.add('ready'));
document.querySelectorAll('[data-switch]').forEach(button=>button.addEventListener('click',()=>{
 const mode=button.dataset.switch;
 card.dataset.mode=mode;
 forms.forEach(form=>{form.inert=!form.classList.contains(mode);form.querySelector('.status').textContent='';});
 const heading=document.querySelector('.welcome h2');
 heading.innerHTML=mode==='signup'?'HELLO,<br>FRIEND!':'WELCOME<br>BACK!';
 setTimeout(()=>{if(card.dataset.mode===mode)document.querySelector('.'+mode+' input').focus();},450);
}));
document.querySelectorAll('.eye').forEach(button=>button.addEventListener('click',()=>{
 const input=button.parentElement.querySelector('input');
 const visible=input.type==='password';
 input.type=visible?'text':'password';
 button.setAttribute('aria-pressed',String(visible));
 button.setAttribute('aria-label',visible?'Hide password':'Show password');
}));
forms.forEach(form=>form.addEventListener('submit',event=>{
 event.preventDefault();
 form.querySelector('.status').textContent='Demo complete. Connect this form to your authentication backend.';
}));
</script>
</body>
</html>
