<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login &amp; Signup Form | CodeWithRishabh</title>
<style>
:root{color-scheme:light;--bg:#e3e0fa;--ink:#292929;--muted:#595959;--red:#831d25;font-family:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
.login-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 580px;
  padding: 76px 12px;
}
.layout{position:relative;text-align:center;width:min(588px,100%)}
.title{margin:0 0 .72em;color:#54358a;font:bold italic clamp(24px,5.5vw,42px)/1.1 Georgia,serif}
.scene{display:grid;place-items:center;padding:clamp(12px,3.2vw,34px);border-radius:24px;background:radial-gradient(ellipse at 50% 48%,#9fb4e9 0%,#5779bf 47%,#344f90 71%,#182d58 100%);perspective:1100px}
.scene .flip{max-width:100%}
.flip{position:relative;width:min(520px,calc(100vw - 24px));aspect-ratio:1;transform-style:preserve-3d;transition:transform .58s cubic-bezier(.58,.07,.36,1)}
.flip.is-signup{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:50%}
.face.signup{transform:rotateY(180deg)}
.glass-circle {
  position: absolute;
  inset: 0;
  width: 520px;
  height: 520px;
  max-width: 100%;
  max-height: 100%;
  border-radius: 50%;
  background:linear-gradient(135deg,#eaf0fa,#d5dfef 74%,#e8f0fc);
  box-shadow:0 0 28px #e2eeffdd,0 0 55px #a7c9fb80,inset 0 0 0 2px #ffffff75,inset 5px 6px 9px #fff9,inset -7px -8px 10px #ffffff70;
}
form{position:relative;width:56%;display:grid;gap:clamp(5px,1.7vw,14px);margin:0}
h2{font-size:clamp(23px,6vw,42px);line-height:1.03;margin:0;letter-spacing:-.035em;outline:0}
.hint,.switch,.options{margin:0;color:var(--muted);font-size:clamp(9px,2.1vw,13px)}
.hint{margin:-2px 0 clamp(4px,1.4vw,10px)}
.field{display:flex;align-items:center;gap:.6em;min-height:clamp(30px,6.3vw,43px);padding:0 clamp(7px,2vw,15px);border:1px solid #ffffff60;border-radius:10px;background:#e1eafa;box-shadow:inset 3px 4px 8px #9daecb77,inset -4px -5px 8px #ffffffdb;color:#666}
.field:focus-within{color:var(--red);border-color:#b46b71;box-shadow:inset 2px 3px 7px #962f3c47;outline:1px solid #a9555c60}
.field svg{width:15px;height:15px;flex:0 0 15px;fill:currentColor}
.field input{min-width:0;width:100%;padding:4px 0;border:0;outline:0;background:transparent;color:var(--ink);font-size:clamp(11px,2.5vw,15px)}
.field input::placeholder{color:#636363;opacity:1}
button,input{font:inherit}
button{cursor:pointer}
.options{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px;text-align:left}
.options label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.options input{margin:0;appearance:none;width:23px;height:13px;border:1px solid #bcbcbc;border-radius:10px;background:#d4d4d4;cursor:pointer;position:relative}
.options input::before{content:"";position:absolute;left:1px;top:1px;width:9px;height:9px;background:#f4f4f4;border-radius:50%}
.options input:checked{background:var(--red);border-color:var(--red)}
.options input:checked::before{left:11px}
.primary{border:0;min-height:clamp(29px,6.3vw,43px);border-radius:10px;background:#e7effb;color:#414141;box-shadow:-5px -5px 10px #fff9,5px 7px 10px #8a98b37a;font-size:clamp(10px,2.4vw,15px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;transition:background .18s,color .18s}
.primary:hover,.primary:focus-visible{background:var(--red);color:white}
.text-btn{border:0;padding:2px 0;background:none;color:inherit;font-size:inherit}
.text-btn:hover{text-decoration:underline}
.switch .text-btn{color:var(--red);font-weight:800}
.credit{margin:1.8rem 0 0;color:var(--muted);font-size:12px}
#status{position:absolute;top:100%;width:100%;margin:8px 0 0;font-size:12px}
svg.defs{position:absolute;width:0;height:0}
@media(max-width:370px){form{width:64%}}
@media(prefers-reduced-motion:reduce){*,*::before{transition:none!important}}
</style>
<svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="person" viewBox="0 0 16 16"><circle cx="8" cy="4.5" r="3"/><path d="M1.5 15v-1a6.5 5 0 0 1 13 0v1z"/></symbol>
  <symbol id="lock" viewBox="0 0 16 16"><path d="M4 7V5a4 4 0 0 1 8 0v2h1a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm1.5 0h5V5a2.5 2.5 0 1 0-5 0z"/></symbol>
  <symbol id="mail" viewBox="0 0 16 16"><path d="M1 4V3h14v1L8 9zm0 2 7 5 7-5v7H1z"/></symbol>
</svg>
<main class="login-wrapper">
  <section class="layout" aria-labelledby="title">
    <h1 class="title" id="title">Login &amp; Signup Form</h1>
    <div class="scene">
      <div class="flip" id="card">
        <div class="face">
          <div class="glass-circle" aria-hidden="true"></div>
          <form id="login" aria-labelledby="login-title">
            <h2 id="login-title" tabindex="-1">Login</h2>
            <p class="hint">Sign in to your account</p>
            <label class="field"><svg aria-hidden="true"><use href="#person"/></svg><input placeholder="Username" aria-label="Username" autocomplete="username" required></label>
            <label class="field"><svg aria-hidden="true"><use href="#lock"/></svg><input type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required></label>
            <div class="options">
              <label><input type="checkbox"> Remember me</label>
              <button class="text-btn" id="forgot" type="button">Forgot password?</button>
            </div>
            <button class="primary" type="submit">Sign in</button>
            <p class="switch">Don’t have an account? <button class="text-btn" type="button" data-view="signup">Sign up</button></p>
          </form>
        </div>
        <div class="face signup" inert>
          <div class="glass-circle" aria-hidden="true"></div>
          <form id="signup" aria-labelledby="signup-title">
            <h2 id="signup-title" tabindex="-1">Sign Up</h2>
            <p class="hint">Create your account</p>
            <label class="field"><svg aria-hidden="true"><use href="#person"/></svg><input placeholder="Full name" aria-label="Full name" autocomplete="name" required></label>
            <label class="field"><svg aria-hidden="true"><use href="#mail"/></svg><input type="email" placeholder="Email" aria-label="Email" autocomplete="email" required></label>
            <label class="field"><svg aria-hidden="true"><use href="#lock"/></svg><input type="password" placeholder="Password" aria-label="Password" autocomplete="new-password" required></label>
            <button class="primary" type="submit">Create account</button>
            <p class="switch">Already have an account? <button class="text-btn" type="button" data-view="login">Login</button></p>
          </form>
        </div>
      </div>
    </div>
    <p class="credit">@codewithrishabh3596</p>
    <p id="status" role="status"></p>
  </section>
</main>
<script>
const card = document.querySelector('#card');
const [front, back] = card.querySelectorAll('.face');
const status = document.querySelector('#status');

function showSignup(active) {
  const visible = active ? back : front;
  const hidden = active ? front : back;
  card.classList.toggle('is-signup', active);
  visible.removeAttribute('inert');
  visible.querySelector('h2').focus({preventScroll:true});
  hidden.setAttribute('inert','');
  status.textContent = '';
}

card.addEventListener('click', event => {
  const button = event.target.closest('[data-view]');
  if (button) showSignup(button.dataset.view === 'signup');
});

card.addEventListener('submit', event => {
  event.preventDefault();
  status.textContent = 'Frontend demo only. Nothing was sent.';
});

document.querySelector('#forgot').addEventListener('click', () => {
  status.textContent = 'Password reset is not connected in this demo.';
});
</script>
</html>
