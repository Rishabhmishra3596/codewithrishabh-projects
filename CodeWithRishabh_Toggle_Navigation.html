<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00172f">
<title>Toggle Navigation Menu Bar | CodeWithRishabh</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #00172f; color: white; font-family: Arial, sans-serif; }
  main { width: min(900px, 92%); padding: 35px 0; }
  .brand { font-weight: 800; font-size: 18px; margin: 0 0 14px; }
  h1 { margin: 0 0 30px; font-size: clamp(23px, 4.5vw, 37px); color: #37efa0; }
  .stage { min-height: 390px; padding: 65px 20px 40px; display: flex; justify-content: center; align-items: flex-start; background: #e9e9e9; }
  .navbar { width: 150px; color: #15151c; }
  .toggle { width: 100%; height: 64px; display: grid; place-items: center; border: 0; border-radius: 8px; color: #202027; background: #eaeaea; box-shadow: 2px 3px 5px #d5d5d5, -2px -2px 5px #f5f5f5; cursor: pointer; }
  .hamburger { display: grid; gap: 3px; width: 17px; }
  .hamburger i { display: block; height: 2px; border-radius: 2px; background: currentColor; }
  .menu { list-style: none; padding: 5px 0; margin: 7px 0 0; border-radius: 4px; overflow: hidden; background: #0098ff; box-shadow: 0 4px 8px #0001; }
  .menu[hidden] { display: none; }
  .menu a { display: block; padding: 13px 23px; text-decoration: none; font-size: 13px; font-weight: 700; color: #fff; }
  .menu a:hover, .menu a:focus-visible { background: #0a08f8; outline: none; }
  .toggle:focus-visible { outline: 3px solid #0b69de; outline-offset: 4px; }
  .foot { margin: 22px 0 0; color: #a7c1d8; font-size: 13px; line-height: 1.6; }
  .foot a { color: #37efa0; text-underline-offset: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<main>
  <p class="brand">@codewithrishabh3596</p>
  <h1>Toggle Navigation Menu Bar</h1>
  <div class="stage">
    <nav class="navbar" aria-label="Demo navigation">
      <button class="toggle" id="toggle" type="button" aria-controls="menu" aria-expanded="false" aria-label="Open navigation menu">
        <span class="hamburger" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <ul class="menu" id="menu" hidden>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#blog">Blog</a></li>
      </ul>
    </nav>
  </div>
  <p class="sr-only" id="selection" role="status"></p>
  <p class="foot">Click the button to toggle the menu. Use Tab to move through the links and Escape to close it.<br><a href="https://codewithrishabh.rishabhmishra9619.workers.dev/">Explore code, notes &amp; projects</a></p>
</main>
<script>
  const toggle = document.getElementById('toggle');
  const menu = document.getElementById('menu');
  const navbar = document.querySelector('.navbar');
  function setOpen(open, restoreFocus = false) {
    menu.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
    if (restoreFocus) toggle.focus();
  }
  toggle.addEventListener('click', () => setOpen(menu.hidden));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !menu.hidden) setOpen(false, true);
  });
  document.addEventListener('click', event => {
    if (!navbar.contains(event.target)) setOpen(false);
  });
  menu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', event => {
      event.preventDefault();
      document.getElementById('selection').textContent = link.textContent + ' selected. This is a navigation demo.';
      setOpen(false, true);
    });
  });
</script>
</body>
</html>
